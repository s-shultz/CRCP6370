<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alexis Rose Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Chat with Alexis Rose</h1>
            <p class="subtitle">Your favorite celebutante from Schitt's Creek</p>
            <div class="api-key-container" id="apiKeyContainer">
                <input type="password" id="apiKeyInput" placeholder="Enter your OpenAI API key">
                <button id="saveApiKey">Save Key</button>
            </div>
        </header>
        
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message bot-message">
                    <div class="message-content">
                        <p>Hi there! I'm Alexis Rose, and I'm like, super excited to chat with you! Ask me about pilates, my travels, or literally anything else. I'm basically an expert at everything! 💅</p>
                    </div>
                </div>
            </div>
            
            <div class="chat-input-container">
                <input type="text" id="messageInput" placeholder="Type your message here..." maxlength="500">
                <button id="sendButton">Send</button>
            </div>
            
            <div class="loading" id="loadingIndicator" style="display: none;">
                <div class="loading-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <p>Alexis is thinking...</p>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="index.js"></script>
</body>
</html>
